<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lab — kwzrl</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <script>
    // Same boot as the site: stamp the theme before the first paint so a dark reader
    // never gets flashed a white page. The key is shared with index.html on purpose —
    // walking over from the site should not change the skin under you.
    (function () {
      var t = null;
      try { t = localStorage.getItem("kwzrl:theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ---------- palette ----------
       The subset of the site's ramp this page actually paints. Same values, so the
       field and the two controls read identically to the ones on index.html. */
    :root {
      --bg:      #ffffff;
      --fg:      #141414;
      --fg-3:    #6a6a6a;
      --muted:   #8c8c8c;
      --faint:   #bcbcbc;
      --line:    #e6e6e6;
      --line-2:  #d2d2d2;
      --panel:   #fafafa;
      /* dither dot — read by JS, not by CSS. This is the site's --ink taken down to
         contrast .20, i.e. a fifth of the way from the page towards #b4b4b4. The drawer
         recomputes it from those two endpoints; the literal here is what the first frame
         paints with, before the drawer has run. */
      --ink:     #f0f0f0;
      /* the knobs the drawer turns. --dgain scales the whole field, --dpix is the cell
         in CSS px, --dedge is how much density survives at the four edges. */
      --dgain: .58; --dpix: 3; --dedge: 0;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg:      #0e0e0e;
      --fg:      #ededed;
      --fg-3:    #a2a2a2;
      --muted:   #8a8a8a;
      --faint:   #5c5c5c;
      --line:    #262626;
      --line-2:  #3a3a3a;
      --panel:   #171717;
      --ink:     #161616;   /* the dark skin's #343434, likewise at contrast .20 */
      color-scheme: dark;
    }

    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); font-family: var(--mono); -webkit-font-smoothing: antialiased; }

    /* ---------- the field ----------
       Full bleed, rendered at a third resolution and upscaled with nearest-neighbour so
       every cell lands as a crisp square. On the site this canvas is masked out under
       the reading column; here there is no column, so the mask is gone and the only
       shaping left is a soft envelope at the four edges. */
    .dither { position: fixed; inset: 0; z-index: 0; display: block; pointer-events: none;
              image-rendering: pixelated; image-rendering: crisp-edges; }

    /* ---------- the dock ----------
       The two controls off the site's bar, moved to the corner and given the border the
       bar used to lend them. One hairline between them, none inside: they are one pair
       of controls, not two buttons that happen to be adjacent. */
    .dock { position: fixed; right: 24px; bottom: 24px; z-index: 31; display: flex;
            background: var(--panel); border: 1px solid var(--line); }
    .dock button { display: flex; align-items: center; justify-content: center;
      padding: 12px 16px; background: transparent; color: var(--muted); border: 0;
      cursor: pointer; transition: color .15s, background .15s; }
    .dock button + button { border-left: 1px solid var(--line); }
    .dock button:hover, .dock button.is-on { color: var(--fg); background: var(--bg); }

    /* the tuning handle: two faders at different positions, on the same 1.5px hairline
       everything else here is drawn with, every edge on a whole pixel */
    .ctrltog i { width: 11px; height: 11px; flex: 0 0 auto; display: block; position: relative;
      background:
        linear-gradient(currentColor, currentColor) 0 3px / 11px 1.5px no-repeat,
        linear-gradient(currentColor, currentColor) 0 8px / 11px 1.5px no-repeat; }
    .ctrltog i::before, .ctrltog i::after { content: ""; position: absolute;
      width: 3px; height: 5px; background: currentColor; }
    .ctrltog i::before { left: 2px;  top: 1px; }
    .ctrltog i::after  { right: 2px; top: 6px; }
    /* the theme square — half filled, built to the same 11px measurements */
    .themetog i { width: 11px; height: 11px; border: 1.5px solid currentColor;
      background: linear-gradient(90deg, currentColor 50%, transparent 50%); }

    /* ---------- the drawer ----------
       Opens upward out of the dock, right edges flush, its bottom border sitting on the
       dock's top border — `bottom` is measured off the dock rather than guessed, because
       the dock's height is whatever its padding and glyph make it. Drawn by subtraction,
       like the one on the site: no rules between rows, no boxes, no shadow. */
    .ctrlpanel { position: fixed; right: 24px; z-index: 30; width: 258px; max-width: calc(100vw - 48px);
      background: var(--panel); border: 1px solid var(--line);
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      padding: 15px 15px 12px; display: none; }
    .ctrlpanel.is-on { display: block; }
    .ctrlgrp h4 { font-size: 11px; color: var(--faint); font-weight: 400; margin-bottom: 8px; }
    .ctrlrow { display: flex; align-items: center; gap: 10px; height: 20px; }
    .ctrlrow label { flex: 0 0 56px; color: var(--fg-3); }
    /* tabular so the column does not twitch as digits change under the thumb */
    .ctrlrow output { flex: 0 0 40px; text-align: right; color: var(--fg-3);
      font-variant-numeric: tabular-nums; transition: color .12s; }
    .ctrlrow:hover output, .ctrlrow:focus-within output { color: var(--fg); }
    .ctrlrow input[type="range"] { flex: 1 1 auto; min-width: 0; -webkit-appearance: none; appearance: none;
      height: 20px; background: transparent; cursor: pointer; }
    .ctrlrow input[type="range"]:focus { outline: 0; }
    .ctrlrow input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--line-2); }
    .ctrlrow input[type="range"]::-moz-range-track { height: 1px; background: var(--line-2); }
    .ctrlrow input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
      width: 2px; height: 11px; background: var(--fg); margin-top: -5px; border: 0; border-radius: 0; }
    .ctrlrow input[type="range"]::-moz-range-thumb { width: 2px; height: 11px; background: var(--fg);
      border: 0; border-radius: 0; }
    .ctrlfoot { display: flex; justify-content: flex-end; gap: 13px; margin-top: 15px; }
    .ctrlfoot button { font-family: var(--mono); font-size: 11px; padding: 0;
      background: none; color: var(--faint); border: 0; cursor: pointer; transition: color .12s; }
    .ctrlfoot button:hover { color: var(--fg); }
  </style>
</head>
<body>
  <canvas class="dither" id="dither" aria-hidden="true"></canvas>

  <div class="ctrlpanel" id="ctrlPanel" role="group" aria-label="Tuning controls">
    <div class="ctrlgrp">
      <h4>dither</h4>
      <div class="ctrlrow">
        <label for="cDensity">density</label>
        <input type="range" id="cDensity" min="0" max="1.4" step=".02" value=".58">
        <output for="cDensity" id="oDensity">0.58</output>
      </div>
      <div class="ctrlrow">
        <label for="cContrast">contrast</label>
        <input type="range" id="cContrast" min="0" max="1.6" step=".02" value=".2">
        <output for="cContrast" id="oContrast">0.20</output>
      </div>
      <div class="ctrlrow">
        <label for="cCell">cell</label>
        <input type="range" id="cCell" min="2" max="8" step="1" value="3">
        <output for="cCell" id="oCell">3px</output>
      </div>
      <div class="ctrlrow">
        <label for="cEdge">edge</label>
        <input type="range" id="cEdge" min="0" max="1" step=".02" value="0">
        <output for="cEdge" id="oEdge">0.00</output>
      </div>
    </div>
    <div class="ctrlfoot">
      <button type="button" id="ctrlCopy" title="Copy the values in the shape the real constants take">copy</button>
      <button type="button" id="ctrlReset">reset</button>
    </div>
  </div>

  <div class="dock" id="dock">
    <button class="ctrltog" id="ctrlTog" type="button" aria-expanded="false" aria-controls="ctrlPanel"
            aria-label="Tuning controls" title="Tuning controls"><i aria-hidden="true"></i></button>
    <button class="themetog" id="themeToggle" type="button" aria-pressed="false"
            aria-label="Switch to dark mode" title="Switch to dark mode"><i aria-hidden="true"></i></button>
  </div>

  <script>
  // ============================================================
  //  THEME
  // ============================================================
  //  The <head> boot script has already stamped data-theme, so this only keeps the
  //  square, the meta colour and storage in step — and fires the event the canvas is
  //  listening for.
  (function () {
    const KEY = "kwzrl:theme";
    const tog = document.getElementById("themeToggle");
    const meta = document.querySelector('meta[name="theme-color"]');
    const theme = () => document.documentElement.dataset.theme === "dark" ? "dark" : "light";

    function apply(name) {
      document.documentElement.dataset.theme = name;
      const dark = name === "dark";
      if (meta) meta.setAttribute("content", dark ? "#0e0e0e" : "#ffffff");
      tog.setAttribute("aria-pressed", String(dark));
      const label = dark ? "Switch to light mode" : "Switch to dark mode";
      tog.setAttribute("aria-label", label);
      tog.title = label;
      // the dither paints pixels, not CSS — it has to be told
      dispatchEvent(new CustomEvent("themechange"));
    }
    tog.addEventListener("click", () => {
      const next = theme() === "dark" ? "light" : "dark";
      try { localStorage.setItem(KEY, next); } catch (e) {}
      apply(next);
    });
    apply(theme());
  })();
  </script>

  <script>
  // ============================================================
  //  THE FIELD
  // ============================================================
  //  The site's gutter dither, opened out to the whole page. Everything that shaped it
  //  around the reading column is gone — the column mask, the 720px strip it protected,
  //  the "no gutter worth filling, don't bother" width gate — and what is left is the
  //  field itself: four travelling waves, thresholded against a blue-noise tile, with a
  //  wake the cursor clears through it and a ring every click lets go.
  //
  //  Shaping now comes from one envelope at the four edges instead of a mask down the
  //  middle. It is deliberately isotropic (a fixed px falloff, not a fraction of the
  //  dimension) so the texture meets a wide edge the same way it meets a tall one.
  //
  //  Knobs worth touching: INK, MAXD and the edge envelope for the resting texture;
  //  REACH, NT, CLEAR and RING for the cursor; R_* for the click; the four
  //  frequency/speed pairs inside frame().
  // ============================================================
  (function () {
    const cv = document.getElementById("dither");
    if (!cv || !cv.getContext) return;
    const ctx = cv.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const MAXD  = 0.24;      // resting coverage at full envelope
    const FEDGE = 220;       // px over which the envelope climbs in from each edge
    // The cursor clears a wake, not a disc. The cleared zone is the union of the last
    // NT cursor positions, each with its own radius, so its shape is drawn by how you
    // moved: a long streak when you sweep, a blob when you stop. That is what stops it
    // reading as a compass circle — the outline comes from your movement, not a radius.
    const REACH = 300;       // px radius at the head of the wake
    const NT    = 16;        // trail length in samples — at 60fps, about 0.27s of history
    const TAIL  = 0.42;      // radius at the oldest end, as a fraction of REACH
    const FADE_T = 0.55;     // strength at the oldest end
    const CLEAR = 1.0;       // how much density the wake removes at its core
    const RING  = 0.13;      // dots piling up along the edge of the wake.
                             // Without it the clearing is invisible: white on almost-white.
    const WOB   = 0.42;      // coarse wander of the edge
    const WOB2  = 0.18;      // finer roughness on top

    // The click ring. It is not born at the cursor: the rim sits where the wake's
    // falloff crosses the RING peak — 0.866 of REACH out — so that is where the ring
    // starts, and the pixel you actually hit stays empty. Anything else looks like a
    // circle drawn on top of the texture rather than the texture letting go.
    const RMAX  = 3;         // concurrent rings; a fourth click drops the oldest
    const R_LIFE = 1.05;     // seconds from release to gone
    const R_R0  = REACH * 0.866;   // birth radius — the rim's own radius
    const R_RUN = 340;       // px travelled over that life
    const R_HW0 = 22, R_HW1 = 72;  // band half-width, birth → death. It disperses.
    // Crest density at birth. Not picked by eye: the rim it replaces is RING over a
    // 1-s² profile ~44px to either side of its peak, and the ring is a (1-s²)² profile
    // R_HW0 wide, so 0.13·44·4/3 = R_AMP·22·16/15 conserves the pile exactly. The pile
    // compacts as it lets go, which is why the crest lands well above MAXD.
    const R_AMP = RING * 44 * (4 / 3) / (R_HW0 * (16 / 15));
    const RW1   = 20, RW2 = 8;     // px of edge warp, from the wake's own two noise fields

    // Three travelling waves, each deliberately off-axis. Plain sin(x) + sin(y) terms
    // put the field's own structure on the horizontal and vertical, which is what made
    // the earlier version read as banding. Frequency is folded into the vector.
    const W1X =  1.60 * 0.94, W1Y = 1.60 *  0.34;   //  ~20°
    const W2X =  1.15 * -0.42, W2Y = 1.15 * 0.91;   // ~115°
    const W3X =  0.85 * 0.62, W3Y = 0.85 * -0.78;   //  ~-51°

    // 64x64 blue-noise threshold tile (void-and-cluster, generated offline).
    // An ordered Bayer matrix is the wrong tool at these densities: only the lowest
    // thresholds of each 8x8 cell ever fire, so every dot lands on the same lattice
    // position and the texture reads as a 32px grid. Blue noise has no lattice --
    // the dots stay evenly spaced without ever lining up. Measured on this tile at
    // one-tenth coverage: mean nearest-neighbour 2.60 cells, minimum 2.00; white
    // noise manages 1.71 / 1.00, i.e. it clumps.

        for (let n = 0; n < nact; n++) {
          const dy = py - gCY[n], dq = dy * dy, ro = gR[n] + gPAD[n];
          if (dq >= ro * ro) continue;
          const out = Math.sqrt(ro * ro - dq);
          sCX[nr] = gCX[n]; sDY[nr] = dq; sR[nr] = gR[n]; sIHW[nr] = gIHW[n]; sA[nr] = gA[n];
          sLO[nr] = gCX[n] - out; sHI[nr] = gCX[n] + out;
          const ri = gR[n] - gPAD[n];
          if (ri > 0 && dq < ri * ri) {
            const inn = Math.sqrt(ri * ri - dq);
            sGLO[nr] = gCX[n] - inn; sGHI[nr] = gCX[n] + inn;
          } else { sGLO[nr] = 1e9; sGHI[nr] = -1e9; }
          nr++;
        }
        for (let i = 0; i < cols; i++, k++) {
          const he = hE[i], e = he < ve ? he : ve;
          const m = gE + gI * e;
          if (m <= 0) { buf[k] = 0; continue; }        // gain at zero: nothing at all
          const x = i * PIX / 150;

          const v = (S(W1X * x + q1 + T * 0.16) +
                     S(W2X * x + q2 - T * 0.11) +
                     S(W3X * x + q3 + T * 0.20) +
                     S(rad[k] * 3.10 - T * 0.25)) * 0.25;
          const g = v * 0.5 + 0.5;                      // → 0..1
          // cubed: density collects in the bright folds of the field and leaves the
          // rest genuinely white, instead of spreading an even grain everywhere
          let d = MAXD * g * g * g;

          const px = i * PIX + PIX / 2;
          // the two noise fields that roughen every outline in here. Computed at most
          // once per cell and shared by the wake and the rings — separate noise would
          // let the ring leave along an edge the wake never had.
          let nz1 = 0, nz2 = 0, nz = false;
          if (rowLive && px >= xlo && px <= xhi) {
            // the wake is the union of the trail points — whichever one reaches this
            // cell hardest wins, which is what welds them into one flowing shape
            let t = 0;
            for (let n = 0; n < NT; n++) {
              const q = px - tX[n];
              const u = (1 - (q * q + tDY[n]) * tIR[n]) * tW[n];
              if (u > t) t = u;
            }
            if (t > 0) {
              // roughen the outline so even a standing cursor is not a clean disc
              nz1 = S(W2X * 1.9 * x + wq + T * 0.13); nz2 = S(4.7 * x + wr - T * 0.45); nz = true;
              t += WOB * nz1 + WOB2 * nz2;
              if (t > 0) {
                if (t > 1) t = 1;
                const b = t * t;
                d *= (1 - rpl * b);
                const s = (t - 0.25) * 4, rim = 1 - s * s;   // dots shoved to the edge
                if (rim > 0) d += rng * rim;
              }
            }
          }
          // the rings add, and add after the wake's clearing: a ring is born inside the
          // hole it was released from and has to survive crossing it
          for (let n = 0; n < nr; n++) {
            if (px < sLO[n] || px > sHI[n] || (px > sGLO[n] && px < sGHI[n])) continue;
            if (!nz) { nz1 = S(W2X * 1.9 * x + wq + T * 0.13); nz2 = S(4.7 * x + wr - T * 0.45); nz = true; }
            const q = px - sCX[n];
            const s = (Math.sqrt(q * q + sDY[n]) - sR[n] - RW1 * nz1 - RW2 * nz2) * sIHW[n];
            if (s > -1 && s < 1) { const b = 1 - s * s; d += sA[n] * b * b; }
          }
          buf[k] = (d * m) > THR[trow | (i & TMASK)] ? DOT : 0;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // 60fps while the pointer is engaged — at 30 the wake is always one step behind your
    // hand no matter how little it lags. Back to 30 when nobody is pointing at it.
    function loop(ts) {
      raf = requestAnimationFrame(loop);
      if (ts - last < (near > 0.01 || nrip ? 15 : 32)) return;
      last = ts; frame(ts);
    }
    function stop()  { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
    function start() { if (!raf) { last = 0; raf = requestAnimationFrame(loop); } }

    function apply() {
      layout();
      if (reduce) { stop(); frame(0); return; }        // one static frame, no motion
      start();
    }

    // A running loop picks new ink up on its next frame; a stopped one (reduced motion,
    // or a hidden tab that comes back) needs to be redrawn by hand. Gain and edge are
    // read straight into the next frame; only the cell size costs a relayout, because it
    // is the one that changes how many cells there are.
    addEventListener("themechange", () => {
      DOT  = packInk(readInk());
      GAIN = num("--dgain", 0.58, 0, 4);
      EDGE = num("--dedge", 0, 0, 1);
      const p = num("--dpix", 3, 1, 16) | 0;
      if (p !== PIX) { PIX = p; if (img) layout(); }
      if (!raf && img) frame(last);
    });

    let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(apply, 120); });
    document.addEventListener("visibilitychange", () => document.hidden ? stop() : apply());
    apply();
  })();
  </script>

  <script>
  // ============================================================
  //  CONTROL DRAWER
  // ============================================================
  //  Runs after the field so its first apply() already has a listener to talk to. It
  //  never touches the canvas directly: it writes custom properties on :root and fires
  //  the event the canvas already listens for. That is the whole coupling.
  //
  //  Contrast is the one control that is not a raw variable. It interpolates the ink
  //  between the page colour (0 = the dot is the page, i.e. gone) and the skin's own ink
  //  (1 = the default), and keeps extrapolating past 1. Both endpoints are per-theme, so
  //  the slider means the same thing in both skins and has to be recomputed when the
  //  theme flips — which is what the guarded themechange listener at the bottom is for.
  //  Without that guard it would answer its own event forever.
  // ============================================================
  (function () {
    const root = document.documentElement;
    const panel = document.getElementById("ctrlPanel");
    const tog = document.getElementById("ctrlTog"), dock = document.getElementById("dock");

    // per-skin endpoints for the contrast slider: [page, ink at full strength]
    const INK = { light: ["#ffffff", "#b4b4b4"], dark: ["#0e0e0e", "#343434"] };
    // Tuned in the drawer, then written back here. The endpoints above are untouched by
    // that: contrast still means "all the way to the site's ink", the default just no
    // longer sits at the far end of it.
    const DEF = { density: 0.58, contrast: 0.20, cell: 3, edge: 0 };
    const S = { ...DEF };
    let applying = false;

    const rgb = hex => [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16));
    const hex = c => "#" + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
    function inkFor(theme, t) {
      const [bg, full] = INK[theme] || INK.light, a = rgb(bg), b = rgb(full);
      return hex(a.map((v, i) => v + (b[i] - v) * t));   // t may exceed 1 — it extrapolates
    }

    const el = id => document.getElementById(id);
    const rows = [
      { k: "density",  inp: el("cDensity"),  out: el("oDensity"),  fmt: v => v.toFixed(2) },
      { k: "contrast", inp: el("cContrast"), out: el("oContrast"), fmt: v => v.toFixed(2) },
      { k: "cell",     inp: el("cCell"),     out: el("oCell"),     fmt: v => v + "px" },
      { k: "edge",     inp: el("cEdge"),     out: el("oEdge"),     fmt: v => v.toFixed(2) },
    ];

    function apply() {
      const theme = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      root.style.setProperty("--dgain", String(S.density));
      root.style.setProperty("--ink", inkFor(theme, S.contrast));
      root.style.setProperty("--dpix", String(S.cell));
      root.style.setProperty("--dedge", String(S.edge));

      for (const r of rows) { if (r.inp) { r.inp.value = S[r.k]; r.out.textContent = r.fmt(S[r.k]); } }

      applying = true;
      dispatchEvent(new CustomEvent("themechange", { detail: "control" }));
      applying = false;
      try { localStorage.setItem("kwzrl:lab", JSON.stringify(S)); } catch (e) {}
    }

    for (const r of rows) {
      if (!r.inp) continue;
      r.inp.addEventListener("input", () => { S[r.k] = parseFloat(r.inp.value); apply(); });
    }
    el("ctrlReset").addEventListener("click", () => { Object.assign(S, DEF); apply(); });

    // the values in the shape the real constants take
    const report = () =>
      `--dgain: ${S.density}\n--ink:   ${inkFor("light", S.contrast)} / ${inkFor("dark", S.contrast)}\n` +
      `--dpix:  ${S.cell}px\n--dedge: ${S.edge}`;

    el("ctrlCopy").addEventListener("click", async () => {
      const btn = el("ctrlCopy"), was = btn.textContent;
      try { await navigator.clipboard.writeText(report()); btn.textContent = "copied"; }
      catch (e) { btn.textContent = "blocked"; console.log(report()); }
      setTimeout(() => { btn.textContent = was; }, 1100);
    });

    // open / close. The drawer's bottom is measured off the dock rather than written
    // down: the dock's height is whatever its padding and its 11px glyph make it, and
    // the -1 lands the two hairlines on each other instead of stacking them into a 2px
    // rule. Both are positioned from the same corner, so the two share an origin.
    function place() {
      panel.style.bottom = (24 + dock.offsetHeight - 1) + "px";
    }
    function open(v) {
      panel.classList.toggle("is-on", v);
      tog.classList.toggle("is-on", v);
      tog.setAttribute("aria-expanded", v ? "true" : "false");
      if (v) place();
    }
    tog.addEventListener("click", e => { e.stopPropagation(); open(!panel.classList.contains("is-on")); });
    document.addEventListener("click", e => {
      if (panel.classList.contains("is-on") && !panel.contains(e.target)) open(false);
    });
    addEventListener("keydown", e => { if (e.key === "Escape") open(false); });
    addEventListener("resize", () => { if (panel.classList.contains("is-on")) place(); });

    // the theme square changes what "contrast 1" resolves to, so the ink has to be
    // recomputed — but only for a real theme flip, or this reacts to its own events
    addEventListener("themechange", e => {
      if (applying || e.detail === "control") return;
      apply();
    });

    try { Object.assign(S, JSON.parse(localStorage.getItem("kwzrl:lab") || "{}")); } catch (e) {}
    apply();
  })();
  </script>
</body>
</html>
